[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdx-code"
version = "2.0.0-alpha.1"
description = "The AI Engineering Manager for your codebase."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "MD"}]
keywords = [
    "ai", "llm", "developer-tools", "code-review",
    "governance", "multi-model", "adversarial-review",
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
]

[project.scripts]
mdx = "mdxcode.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["mdxcode*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
