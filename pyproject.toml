[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdx-code"
version = "0.2.0"
description = "The AI Engineering Manager for your codebase."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "MD"}]
keywords = [
    "ai", "llm", "developer-tools", "code-review",
    "governance", "multi-model", "adversarial-review",
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/dhotherm/mdx-code"
Repository = "https://github.com/dhotherm/mdx-code"
Documentation = "https://github.com/dhotherm/mdx-code#readme"
"Bug Tracker" = "https://github.com/dhotherm/mdx-code/issues"
Changelog = "https://github.com/dhotherm/mdx-code/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
]
mcp = ["mcp>=1.0.0"]

[project.scripts]
mdx = "mdxcode.cli:app"
mdx-governance-server = "mcp_servers.governance.server:main"
mdx-audit-server = "mcp_servers.audit.server:main"
mdx-cost-server = "mcp_servers.cost.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mdxcode*", "mcp_servers*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
